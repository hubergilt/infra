; Silent SQL Server 2025 install config. Passwords are deliberately NOT
; here (Microsoft's own guidance) — they're passed as command-line
; switches by 02-Install-SQLServer.ps1, sourced from credentials.ps1
; which is dropped alongside this file on the answer-media ISO.

[OPTIONS]
ACTION="Install"
QUIET="True"
IACCEPTSQLSERVERLICENSETERMS="True"
FEATURES=SQLENGINE
INSTANCENAME="MSSQLSERVER"
INSTANCEID="MSSQLSERVER"

; Service accounts — lab default uses the built-in virtual accounts.
; Swap to a domain gMSA/service account for production by setting
; SQLSVCACCOUNT/AGTSVCACCOUNT here and removing the *ACCOUNT defaults.
SQLSVCSTARTUPTYPE="Automatic"
AGTSVCSTARTUPTYPE="Automatic"
SQLSVCACCOUNT="NT AUTHORITY\NETWORK SERVICE"
AGTSVCACCOUNT="NT AUTHORITY\NETWORK SERVICE"

; Mixed mode so sa/ is usable immediately; SAPWD supplied on the command line.
SECURITYMODE="SQL"

SQLSYSADMINACCOUNTS="BUILTIN\Administrators"

; Network: enable TCP for app-tier connections (App->Data:1433 per ACL matrix)
TCPENABLED="1"
NPENABLED="0"

; Collation — adjust if your app tier expects something else
SQLCOLLATION="SQL_Latin1_General_CP1_CI_AS"

; Install locations
INSTALLSQLDATADIR="C:\SQLData"
SQLBACKUPDIR="C:\SQLBackup"

UPDATEENABLED="False"
SUPPRESSPRIVACYSTATEMENTNOTICE="True"
