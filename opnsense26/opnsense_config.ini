# opnsense_config.ini — fw01.ad.lab firewall configuration reference
# Human-readable layout — NOT imported by OPNsense directly.
# The authoritative config is config.xml.
#
# Network layout (per general-nw.puml):
#   WAN      vtnet0  10.0.0.2/30     gateway: 10.0.0.1 (hypervisor NAT)
#   APP      vtnet1  10.0.1.1/24     api_gw, app, dhcp01, fs
#   DMZ_WEB  vtnet2  10.0.2.1/24     waf01, web01, lb01, rodc01
#   MGMT     vtnet3  10.0.3.1/24     jump01, siem01, sccm01, backup01
#   CLIENTS  vtnet4  10.0.4.1/24     client01 (DHCP relayed from dhcp01)
#   DMZ_VPN  vtnet5  10.0.5.1/24     vpn01, rodc01 (VPN leg)
#   DATA     vtnet6  10.0.6.1/24     sql01, ora01, fs01, fs02
#   IDENTITY vtnet7  10.0.7.1/24     ad01, ad02, ca01, ca02

# ── System ────────────────────────────────────────────────────────────────────
[Host]
hostname = fw01
domain   = ad.lab
# DNS points to DCs on IDENTITY network
# During bootstrap before DCs exist, set temporarily to 8.8.8.8
dns      = 10.0.7.10, 10.0.7.11

# ── WAN — lab-wan 10.0.0.0/30 ────────────────────────────────────────────────
# P2P link between fw01 and host NAT bridge (virbr-wan / 10.0.0.1)
[WAN]
if      = vtnet0
ip      = 10.0.0.2
subnet  = 30
gateway = 10.0.0.1

# ── APP — lab-app 10.0.1.0/24 ────────────────────────────────────────────────
# Application tier — api gateways, app servers, shared services
# DHCP scope: .50-.200 (static below .50)
# Static:
#   10.0.1.1   fw01
#   10.0.1.10  ad01 (APP NIC — domain join only)
#   10.0.1.11  ad02 (APP NIC)
#   10.0.1.20  ca01 (offline root CA — NIC unconfigured during normal ops)
#   10.0.1.21  ca02 (issuing CA / ADCS)
#   10.0.1.30  dhcp01
#   10.0.1.31  fs01
#   10.0.1.32  fs02
#   10.0.1.40  app01
#   10.0.1.41  api_gw01
#   10.0.1.43  api_gw02
[APP]
if          = vtnet1
ip          = 10.0.1.1
subnet      = 24
description = APP
dhcp_start  = 10.0.1.50
dhcp_end    = 10.0.1.200

# ── DMZ_WEB — lab-dmz-web 10.0.2.0/24 ───────────────────────────────────────
# Public-facing web tier — no DHCP, all static
# Static:
#   10.0.2.1   fw01
#   10.0.2.10  lb01
#   10.0.2.11  web01
#   10.0.2.12  waf01 (reverse proxy / ARR — internet-facing)
#   10.0.2.15  rodc01 (DMZ-Web leg — Kerberos/LDAP for web tier only)
[DMZ_WEB]
if          = vtnet2
ip          = 10.0.2.1
subnet      = 24
description = DMZ_WEB

# ── MGMT — lab-mgmt 10.0.3.0/24 ─────────────────────────────────────────────
# Out-of-band control plane — isolated, no DHCP
# Static:
#   10.0.3.1   fw01
#   10.0.3.10  jump01 (bastion / MGMT NIC)
#   10.0.3.20  siem01
#   10.0.3.30  sccm01
#   10.0.3.40  backup01
#   10.0.3.254 virbr-mgmt (host bridge)
[MGMT]
if          = vtnet3
ip          = 10.0.3.1
subnet      = 24
description = MGMT

# ── CLIENTS — lab-clients 10.0.4.0/24 ────────────────────────────────────────
# Domain-joined workstations — DHCP via fw01 relay to dhcp01 (10.0.1.30)
# Static:
#   10.0.4.1   fw01 (DHCP relay agent)
#   10.0.4.50–200  DHCP pool (served by dhcp01)
[CLIENTS]
if          = vtnet4
ip          = 10.0.4.1
subnet      = 24
description = CLIENTS
dhcp_relay  = 10.0.1.30

# ── DMZ_VPN — lab-dmz-vpn 10.0.5.0/24 ───────────────────────────────────────
# Remote access tier — no DHCP, all static
# vpn01 is single-armed (DMZ_VPN NIC only); fw01 routes decrypted VPN traffic
# Static:
#   10.0.5.1   fw01
#   10.0.5.10  vpn01 (RRAS / IKEv2 — internet-facing via NAT)
#   10.0.5.15  rodc01 (DMZ-VPN leg — auth for VPN clients)
[DMZ_VPN]
if          = vtnet5
ip          = 10.0.5.1
subnet      = 24
description = DMZ_VPN

# ── DATA — lab-data 10.0.6.0/24 ──────────────────────────────────────────────
# Data tier — no internet, no outbound from this segment
# Static:
#   10.0.6.1   fw01
#   10.0.6.31  fs01 (SMB — data NIC)
#   10.0.6.32  fs02 (SMB replica)
#   10.0.6.70  sql01 (SQL Server)
#   10.0.6.80  ora01 (Oracle DB)
[DATA]
if          = vtnet6
ip          = 10.0.6.1
subnet      = 24
description = DATA

# ── IDENTITY — lab-identity 10.0.7.0/24 ──────────────────────────────────────
# Identity and PKI tier — no internet, no outbound from this segment
# Static:
#   10.0.7.1   fw01
#   10.0.7.10  ad01 (Primary DC / DNS1 / DNS for all segments)
#   10.0.7.11  ad02 (Replica DC / DNS2)
#   10.0.7.20  ca01 (Offline Root CA — NIC disconnected during normal ops)
#   10.0.7.21  ca02 (Issuing CA / ADCS Web Enrollment)
[IDENTITY]
if          = vtnet7
ip          = 10.0.7.1
subnet      = 24
description = IDENTITY
