;SQL Server 2025 Configuration File
; Consumed by phase3-sql01-unattended.ps1 via:
;   setup.exe /ConfigurationFile=C:\Provision\ConfigurationFile.ini /SAPWD=... /IACCEPTSQLSERVERLICENSETERMS
; Source media: SQLServer2025-x64-ENU-EntDev.iso (Enterprise Evaluation/Developer build)
;
; SAPWD is intentionally NOT set here - phase3-sql01-unattended.ps1
; generates it at provisioning time and passes it on the command line so
; it never lands in this file or in git.

[OPTIONS]

ACTION="Install"
QUIET="True"
QUIETSIMPLE="False"

IACCEPTSQLSERVERLICENSETERMS="True"
IACCEPTROPENLICENSETERMS="True"

; SQLENGINE  - Database Engine
; CONN       - Client connectivity tools
; BC         - Backward-compat components
; SSMS is not installable via setup.exe - install separately if needed.
FEATURES="SQLENGINE,CONN,BC"

; Enterprise Developer (EntDev) media - no PID needed, uses the free
; Developer/Evaluation license baked into the ISO.
;PID=""

SUPPRESSPRIVACYSTATEMENTNOTICE="True"

INSTANCENAME="MSSQLSERVER"
INSTANCEID="MSSQLSERVER"

INSTALLSHAREDDIR="C:\Program Files\Microsoft SQL Server"
INSTALLSHAREDWOWDIR="C:\Program Files (x86)\Microsoft SQL Server"
INSTANCEDIR="C:\Program Files\Microsoft SQL Server"
SQLBACKUPDIR="D:\SQLData\Backup"
SQLUSERDBDIR="D:\SQLData\Data"
SQLUSERDBLOGDIR="D:\SQLData\Log"
SQLTEMPDBDIR="D:\SQLData\TempDB"
SQLTEMPDBLOGDIR="D:\SQLData\TempDB"

; sql01 gets 4 vCPUs by default in create-sql01-vm.sh - one TempDB file
; per core is the general guidance up to 8 cores.
SQLTEMPDBFILECOUNT="4"
SQLTEMPDBFILESIZE="64"
SQLTEMPDBFILEGROWTH="64"
SQLTEMPDBLOGFILESIZE="64"
SQLTEMPDBLOGFILEGROWTH="64"

SQLCOLLATION="SQL_Latin1_General_CP1_CI_AS"

; Mixed mode - needed so `sa` (and other SQL logins) work, not just
; Windows auth.
SECURITYMODE="SQL"

; Windows accounts that get sysadmin on the new instance. Replace with
; your own admin account/group before running in anything but a lab -
; don't leave BUILTIN\Administrators wide open in production.
SQLSYSADMINACCOUNTS="BUILTIN\Administrators"

; Built-in virtual accounts - no service-account password to manage.
; Swap for a domain\svc-sqlengine account + /SQLSVCPASSWORD on the
; setup.exe command line (add it in phase3-sql01-unattended.ps1
; alongside /SAPWD) if this instance is domain-joined and you want a
; dedicated domain service account instead.
SQLSVCACCOUNT="NT SERVICE\MSSQLSERVER"
SQLSVCSTARTUPTYPE="Automatic"
AGTSVCACCOUNT="NT SERVICE\SQLSERVERAGENT"
AGTSVCSTARTUPTYPE="Automatic"

TCPENABLED="1"
NPENABLED="0"

; Default instance - browser service not needed.
BROWSERSVCSTARTUPTYPE="Disabled"

SQLSVCINSTANTFILEINIT="True"

UpdateEnabled="False"
UPDATESOURCE="MU"

ADDCURRENTUSERASSQLADMIN="False"
