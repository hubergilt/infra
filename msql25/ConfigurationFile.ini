; ConfigurationFile.ini
; Unattended install for sql01 — SQL Server 2025, Database Engine only.
; Consumed by: setup.exe /ConfigurationFile=ConfigurationFile.ini /IACCEPTSQLSERVERLICENSETERMS
; Invoked from phase7-sql01.ps1. Media: SQLServer2025-x64-ENU-EntDev.iso (Developer
; edition — no product key required, full Enterprise feature set for non-production use).
;
; Auth model matches the rest of ad.lab: Windows/Kerberos only, no SQL logins,
; consistent with app01/web01 using Windows Authentication end-to-end.

[OPTIONS]
ACTION="Install"
QUIET="True"
QUIETSIMPLE="False"
UpdateEnabled="False"
SUPPRESSPRIVACYSTATEMENTNOTICE="True"

; -- Features -----------------------------------------------------------
; Engine only — this is a data-tier host per the nwdiag, not a BI/reporting box.
FEATURES="SQLENGINE"

; -- Instance -------------------------------------------------------------
INSTANCENAME="MSSQLSERVER"
INSTANCEID="MSSQLSERVER"

; -- Service accounts -----------------------------------------------------
; NT Service virtual account: no domain service account to provision/rotate,
; still gets a unique, least-privilege identity. Fine for a single-instance
; lab host; swap for a gMSA (ADLAB\svc-sql01$) if this ever needs cross-server
; Kerberos delegation (linked servers, AG endpoints, etc).
SQLSVCACCOUNT="NT SERVICE\MSSQLSERVER"
SQLSVCSTARTUPTYPE="Automatic"
AGTSVCACCOUNT="NT SERVICE\SQLSERVERAGENT"
AGTSVCSTARTUPTYPE="Automatic"

; -- Security ---------------------------------------------------------------
; SECURITYMODE intentionally omitted -> Windows Authentication mode only,
; matching Windows Auth used on app01/web01. Domain admin kept as sysadmin
; for lab operability, same convention as the other tiers.
SQLSYSADMINACCOUNTS="ADLAB\Administrator" "BUILTIN\Administrators"

; -- TCP/IP -------------------------------------------------------------
; Enabled here; fixed to port 1433 afterwards by phase7-sql01.ps1 (the ini
; can't pin a static TCP port, only turn the protocol on).
TCPENABLED="1"
NPENABLED="0"

; -- Collation ------------------------------------------------------------
SQLCOLLATION="SQL_Latin1_General_CP1_CI_AS"

; -- File placement — on the dedicated data disk (F:), not the OS disk (C:) --
INSTALLSQLDATADIR="F:\SQLData"
SQLUSERDBDIR="F:\SQLData"
SQLUSERDBLOGDIR="F:\SQLLogs"
SQLTEMPDBDIR="F:\SQLTempDB"
SQLTEMPDBLOGDIR="F:\SQLTempDB"
SQLBACKUPDIR="F:\SQLBackup"

; -- Memory / misc ----------------------------------------------------------
BROWSERSVCSTARTUPTYPE="Disabled"
FILESTREAMLEVEL="0"
ENABLERANU="False"
SQMREPORTING="False"
